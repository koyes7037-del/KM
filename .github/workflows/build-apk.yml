name: Build KM APK
# Build the Valuation Android APK for main and native migration branches

on:
  push:
    branches: [main, native-migration]
    paths:
      - 'km-pwa.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy KM app into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp km-pwa.html android/app/src/main/assets/km-pwa.html
      - name: Validate embedded JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('km-pwa.html', 'utf8');
          const chunks = html.split('<script');
          if (chunks.length < 2) throw new Error('No inline JavaScript found');
          let count = 0;
          for (const chunk of chunks.slice(1)) {
            const start = chunk.indexOf('>');
            const end = chunk.indexOf('</script>');
            if (start < 0 || end < 0) continue;
            const code = chunk.slice(start + 1, end);
            if (code.trim()) { new Function(code); count++; }
          }
          console.log('Validated ' + count + ' JavaScript block(s).');
          NODE
      - name: Build debug APK
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KM-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
