<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b5d">
<title>Wholesale Business Manager</title>
<style>
:root{--navy:#123b5d;--blue:#1769aa;--bg:#f3f6fa;--card:#fff;--muted:#667085;--green:#12805c;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bg);color:#172b3a}
header{background:var(--navy);color:white;padding:16px 16px 13px;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:750;font-size:18px}.sub{font-size:12px;opacity:.8;margin-top:3px}
button,select,input{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:650;cursor:pointer}
.lang{background:#ffffff20;border:1px solid #ffffff55;padding:7px 10px}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;position:sticky;top:65px;z-index:4;border-bottom:1px solid #e4eaf0}
nav button{white-space:nowrap;background:#eaf1f7;color:#21435e;padding:8px 11px;font-size:13px}
nav button.active{background:var(--navy);color:#fff}
main{max-width:900px;margin:auto;padding:14px}
h2{font-size:19px;margin:5px 0 13px}h3{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border:1px solid #e5ebf1;border-radius:14px;padding:14px;box-shadow:0 2px 7px #102a4308}
.k{font-size:12px;color:var(--muted)}.v{font-size:23px;font-weight:750;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label{font-size:12px;color:#536575;display:block;margin-bottom:4px}
input,select{width:100%;border:1px solid #d7e0e8;border-radius:9px;padding:10px;background:#fff;color:#172b3a}
.full{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:12px}.secondary{background:#e9eff5;color:#24445f}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid #edf0f3}th{color:#607080;font-weight:650}
.tablewrap{overflow:auto}.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.note{font-size:12px;color:var(--muted);line-height:1.5}.pill{font-size:11px;border-radius:30px;padding:4px 8px;background:#e8f5ef;color:#14734f}
.hidden{display:none!important}.section{display:grid;gap:12px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}main{padding:22px}nav{justify-content:center}}
</style></head>
<body>
<header><div class="top"><div><div class="brand">Wholesale Business Manager</div><div class="sub" id="subtitle">পাইকারি ব্যবসার হিসাব ব্যবস্থাপনা</div></div><button class="lang" id="langBtn">বাংলা / EN</button></div></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const state={lang:'bn',tab:'dashboard',products:[],customers:[],sales:[],purchases:[],deposits:[],expenses:[],slabs:[],staff:[]};
const labels={
bn:{dashboard:'ড্যাশবোর্ড',products:'পণ্য',customers:'দোকানদার',slabs:'পাইকারি স্ল্যাব',purchase:'পণ্য ক্রয়',sales:'বিক্রি / বিল',deposit:'জমা টাকা',expenses:'খরচ',reports:'রিপোর্ট',settings:'সেটিংস',stock:'বর্তমান স্টক',todaySales:'মোট বিক্রি',receivable:'দোকানদারের পাওনা',profit:'আনুমানিক মোট লাভ',addProduct:'নতুন পণ্য',name:'পণ্যের নাম',code:'পণ্য কোড',buy:'ক্রয়মূল্য',sell:'সাধারণ পাইকারি দাম',qty:'পরিমাণ',save:'সংরক্ষণ',customer:'দোকানদার',phone:'মোবাইল',amount:'টাকার পরিমাণ',date:'তারিখ',discount:'ডিসকাউন্ট %',bill:'বিল তৈরি করুন',total:'মোট',net:'সর্বমোট',paid:'জমা দিয়েছেন',due:'বাকি',add:'যোগ করুন',item:'পণ্য',price:'দর',actions:'কাজ',noData:'এখনো কোনো তথ্য যোগ করা হয়নি।',slabName:'স্ল্যাবের নাম',minQty:'সর্বনিম্ন পরিমাণ',maxQty:'সর্বোচ্চ পরিমাণ',slabPrice:'প্রতি পিস দাম',expenseType:'খরচের ধরন',memo:'বিবরণ',staff:'কর্মচারী অ্যাকাউন্ট',role:'ভূমিকা',admin:'মালিক / Admin',manager:'ম্যানেজার',worker:'কর্মচারী',offline:'অফলাইন ডেটা এই ডিভাইসে সংরক্ষিত',sync:'অনলাইন সিঙ্ক: সার্ভার সংযোগ প্রয়োজন',language:'ভাষা',export:'ডেটা ব্যাকআপ ডাউনলোড',import:'ব্যাকআপ ফিরিয়ে আনুন',choose:'নির্বাচন করুন',addCustomer:'নতুন দোকানদার',purchase:'পণ্য ক্রয়',purchaseSave:'ক্রয় সংরক্ষণ',saleSave:'বিক্রি সংরক্ষণ',cash:'নগদ / ব্যাংক',history:'লেনদেনের ইতিহাস',warning:'নোট: এটি প্রাথমিক অফলাইন প্রোটোটাইপ। একাধিক মোবাইলে লাইভ সিঙ্ক ও নিরাপদ কর্মচারী লগইনের জন্য ক্লাউড সার্ভার সংযোগ পরের ধাপে যুক্ত করতে হবে।'},
en:{dashboard:'Dashboard',products:'Products',customers:'Shops',slabs:'Wholesale Slabs',purchase:'Purchase',sales:'Sales / Invoice',deposit:'Deposits',expenses:'Expenses',reports:'Reports',settings:'Settings',stock:'Current stock value',todaySales:'Total sales',receivable:'Customer receivables',profit:'Estimated gross profit',addProduct:'Add product',name:'Product name',code:'Product code',buy:'Purchase cost',sell:'Wholesale base price',qty:'Quantity',save:'Save',customer:'Shop / Customer',phone:'Phone',amount:'Amount',date:'Date',discount:'Discount %',bill:'Create invoice',total:'Subtotal',net:'Grand total',paid:'Paid',due:'Due',add:'Add',item:'Product',price:'Price',actions:'Actions',noData:'No records yet.',slabName:'Slab name',minQty:'Minimum quantity',maxQty:'Maximum quantity',slabPrice:'Price per unit',expenseType:'Expense type',memo:'Description',staff:'Staff accounts',role:'Role',admin:'Owner / Admin',manager:'Manager',worker:'Staff',offline:'Offline data is stored on this device',sync:'Online sync: server connection required',language:'Language',export:'Download data backup',import:'Restore backup',choose:'Select',addCustomer:'Add shop',purchaseSave:'Save purchase',saleSave:'Save sale',cash:'Cash / Bank',history:'Transaction history',warning:'Note: This is an initial offline prototype. Live multi-device sync and secure staff login require a cloud server connection in the next stage.'}
};
const L=k=>labels[state.lang][k]||k, money=n=>'৳'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
function load(){try{const d=JSON.parse(localStorage.getItem('wbm-data')||'{}');Object.assign(state,d)}catch(e){}}
function persist(){localStorage.setItem('wbm-data',JSON.stringify(state))}
const tabs=['dashboard','products','customers','slabs','purchase','sales','deposit','expenses','reports','settings'];
function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${state.tab===t?'active':''}" onclick="go('${t}')">${L(t)}</button>`).join('')}
function go(t){state.tab=t;render()}
function card(k,v,cls=''){return `<div class="card"><div class="k">${L(k)}</div><div class="v ${cls}">${v}</div></div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}
function options(arr,placeholder){return `<option value="">${placeholder||L('choose')}</option>`+arr.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}
function pageDashboard(){
 const stock=state.products.reduce((s,p)=>s+p.qty*p.buy,0),sales=state.sales.reduce((s,x)=>s+x.net,0),due=state.sales.reduce((s,x)=>s+x.net-x.paid,0),cost=state.sales.reduce((s,x)=>s+x.cost,0),profit=state.sales.reduce((s,x)=>s+x.net-x.cost,0);
 return `<h2>${L('dashboard')}</h2><div class="grid">${card('stock',money(stock))}${card('todaySales',money(sales),'green')}${card('receivable',money(due),'red')}${card('profit',money(profit),profit>=0?'green':'red')}</div><div class="card" style="margin-top:12px"><h3>${L('history')}</h3>${table([L('date'),L('customer'),L('net'),L('paid'),L('due')],state.sales.slice(-8).reverse().map(s=>`<tr><td>${s.date}</td><td>${customerName(s.customer)}</td><td>${money(s.net)}</td><td>${money(s.paid)}</td><td>${money(s.net-s.paid)}</td></tr>`).join('')||'')}</div>`;
}
function pageProducts(){return `<h2>${L('products')}</h2><div class="card"><h3>${L('addProduct')}</h3><form id="productForm"><div><label>${L('name')}</label><input name="name" required></div><div><label>${L('code')}</label><input name="code"></div><div><label>${L('buy')}</label><input name="buy" type="number" min="0" step=".01" required></div><div><label>${L('sell')}</label><input name="sell" type="number" min="0" step=".01" required></div><div><label>${L('qty')}</label><input name="qty" type="number" min="0" required></div><div class="full"><button>${L('save')}</button></div></form></div><div class="card"><h3>${L('products')} (${state.products.length})</h3>${table([L('name'),L('code'),L('buy'),L('sell'),L('qty')],state.products.map(p=>`<tr><td>${p.name}</td><td>${p.code||'-'}</td><td>${money(p.buy)}</td><td>${money(p.sell)}</td><td>${p.qty}</td></tr>`).join(''))}</div>`}
function pageCustomers(){return `<h2>${L('customers')}</h2><div class="card"><h3>${L('addCustomer')}</h3><form id="customerForm"><div><label>${L('name')}</label><input name="name" required></div><div><label>${L('phone')}</label><input name="phone"></div><div class="full"><button>${L('save')}</button></div></form></div><div class="card">${table([L('customer'),L('phone'),L('due')],state.customers.map(c=>{let d=state.sales.filter(s=>s.customer==c.id).reduce((a,s)=>a+s.net-s.paid,0);return `<tr><td>${c.name}</td><td>${c.phone||'-'}</td><td>${money(d)}</td></tr>`}).join(''))}</div>`}
function pageSlabs(){return `<h2>${L('slabs')}</h2><div class="card"><h3>${L('slabs')}</h3><form id="slabForm"><div><label>${L('slabName')}</label><input name="name" required></div><div><label>${L('item')}</label><select name="product" required>${options(state.products)}</select></div><div><label>${L('minQty')}</label><input name="min" type="number" min="1" required></div><div><label>${L('maxQty')}</label><input name="max" type="number" min="1" placeholder="Unlimited"></div><div><label>${L('slabPrice')}</label><input name="price" type="number" min="0" step=".01" required></div><div class="full"><button>${L('save')}</button></div></form></div><div class="card">${table([L('slabName'),L('item'),L('minQty'),L('maxQty'),L('price')],state.slabs.map(s=>`<tr><td>${s.name}</td><td>${productName(s.product)}</td><td>${s.min}</td><td>${s.max||'∞'}</td><td>${money(s.price)}</td></tr>`).join(''))}</div>`}
function pagePurchase(){return `<h2>${L('purchase')}</h2><div class="card"><form id="purchaseForm"><div><label>${L('item')}</label><select name="product" required>${options(state.products)}</select></div><div><label>${L('qty')}</label><input name="qty" type="number" min="1" required></div><div><label>${L('buy')}</label><input name="price" type="number" min="0" step=".01" required></div><div><label>${L('date')}</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="full"><button>${L('purchaseSave')}</button></div></form></div><div class="card">${table([L('date'),L('item'),L('qty'),L('price')],state.purchases.map(x=>`<tr><td>${x.date}</td><td>${productName(x.product)}</td><td>${x.qty}</td><td>${money(x.price)}</td></tr>`).join(''))}</div>`}
function pageSales(){return `<h2>${L('sales')}</h2><div class="card"><form id="saleForm"><div><label>${L('customer')}</label><select name="customer" required>${options(state.customers)}</select></div><div><label>${L('date')}</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="full"><label>${L('item')}</label><select name="product" required>${options(state.products)}</select></div><div><label>${L('qty')}</label><input name="qty" id="saleQty" type="number" min="1" required></div><div><label>${L('price')}</label><input name="price" id="salePrice" type="number" min="0" step=".01" required></div><div><label>${L('discount')}</label><input name="discount" type="number" min="0" max="100" step=".01" value="0"></div><div><label>${L('paid')}</label><input name="paid" type="number" min="0" step=".01" value="0"></div><div class="full"><button>${L('saleSave')}</button></div></form><p class="note">স্ল্যাবের দাম স্বয়ংক্রিয়ভাবে প্রস্তাব করা হবে; বিল সংরক্ষণের আগে দাম যাচাই করুন।</p></div><div class="card">${table([L('date'),L('customer'),L('qty'),L('net'),L('paid'),L('due')],state.sales.map(s=>`<tr><td>${s.date}</td><td>${customerName(s.customer)}</td><td>${s.qty}</td><td>${money(s.net)}</td><td>${money(s.paid)}</td><td>${money(s.net-s.paid)}</td></tr>`).join(''))}</div>`}
function pageDeposit(){return `<h2>${L('deposit')}</h2><div class="card"><form id="depositForm"><div><label>${L('customer')}</label><select name="customer" required>${options(state.customers)}</select></div><div><label>${L('amount')}</label><input name="amount" type="number" min=".01" step=".01" required></div><div><label>${L('date')}</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>${L('cash')}</label><select name="method"><option>Cash</option><option>Bank</option><option>bKash</option><option>Nagad</option></select></div><div class="full"><button>${L('save')}</button></div></form></div><div class="card">${table([L('date'),L('customer'),L('amount'),L('cash')],state.deposits.map(d=>`<tr><td>${d.date}</td><td>${customerName(d.customer)}</td><td>${money(d.amount)}</td><td>${d.method}</td></tr>`).join(''))}</div>`}
function pageExpenses(){return `<h2>${L('expenses')}</h2><div class="card"><form id="expenseForm"><div><label>${L('expenseType')}</label><input name="type" required></div><div><label>${L('amount')}</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="full"><label>${L('memo')}</label><input name="memo"></div><div class="full"><button>${L('save')}</button></div></form></div><div class="card">${table([L('expenseType'),L('memo'),L('amount')],state.expenses.map(e=>`<tr><td>${e.type}</td><td>${e.memo||'-'}</td><td>${money(e.amount)}</td></tr>`).join(''))}</div>`}
function pageReports(){let sales=state.sales.reduce((a,s)=>a+s.net,0),cost=state.sales.reduce((a,s)=>a+s.cost,0),exp=state.expenses.reduce((a,e)=>a+e.amount,0);return `<h2>${L('reports')}</h2><div class="grid">${card('total',money(sales))}${card('buy',money(cost))}${card('expenses',money(exp))}${card('profit',money(sales-cost-exp),(sales-cost-exp)>=0?'green':'red')}</div><p class="note">লাভের হিসাব বিক্রিত পণ্যের সংরক্ষিত ক্রয়মূল্য থেকে করা হয়েছে; অন্যান্য কর/পরিবহন/কমিশন যুক্ত করতে হলে খরচে এন্ট্রি দিন।</p>`}
function pageSettings(){return `<h2>${L('settings')}</h2><div class="card"><h3>${L('staff')}</h3><form id="staffForm"><div><label>${L('name')}</label><input name="name" required></div><div><label>${L('role')}</label><select name="role"><option>${L('manager')}</option><option>${L('worker')}</option></select></div><div class="full"><button>${L('add')}</button></div></form><div style="margin-top:12px">${state.staff.map(s=>`<p>${s.name} — ${s.role}</p>`).join('')}</div><p class="note">এখানে কর্মচারীর তালিকা রাখা যায়; পাসওয়ার্ডসহ নিরাপদ লগইন এখনো সার্ভার-সংযোগের অপেক্ষায়।</p></div><div class="card"><h3>${L('language')}</h3><button onclick="toggleLang()">${state.lang==='bn'?'Switch to English':'বাংলায় পরিবর্তন'}</button><hr><button class="secondary" onclick="backup()">${L('export')}</button> <label style="margin-top:12px">${L('import')}<input type="file" accept="application/json" onchange="restore(event)"></label></div><p class="note">${L('offline')}<br>${L('sync')}<br>${L('warning')}</p>`}
function productName(id){return state.products.find(x=>x.id==id)?.name||'-'}function customerName(id){return state.customers.find(x=>x.id==id)?.name||'-'}
function render(){nav();let pages={dashboard:pageDashboard,products:pageProducts,customers:pageCustomers,slabs:pageSlabs,purchase:pagePurchase,sales:pageSales,deposit:pageDeposit,expenses:pageExpenses,reports:pageReports,settings:pageSettings};document.getElementById('app').innerHTML=pages[state.tab]();bindForms()}
function id(){return Date.now()+Math.random()}
function bindForms(){
 const bind=(form,fn)=>{let el=document.getElementById(form);if(el)el.onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(el)));persist();render()}};
 bind('productForm',d=>state.products.push({id:id(),name:d.name,code:d.code,buy:+d.buy,sell:+d.sell,qty:+d.qty}));
 bind('customerForm',d=>state.customers.push({id:id(),name:d.name,phone:d.phone}));
 bind('slabForm',d=>state.slabs.push({id:id(),name:d.name,product:+d.product,min:+d.min,max:+d.max,price:+d.price}));
 bind('purchaseForm',d=>{let p=state.products.find(x=>x.id==d.product);if(!p)return;p.qty+=+d.qty;p.buy=+d.price;state.purchases.push({...d,qty:+d.qty,price:+d.price})});
 bind('saleForm',d=>{let p=state.products.find(x=>x.id==d.product);if(!p||p.qty<+d.qty){alert('স্টকে পর্যাপ্ত পণ্য নেই');return}let q=+d.qty,slab=state.slabs.filter(s=>s.product==p.id&&q>=s.min&&(!s.max||q<=s.max)).sort((a,b)=>b.min-a.min)[0],price=+d.price|| (slab?slab.price:p.sell),subtotal=q*price,net=subtotal*(1-(+d.discount||0)/100);p.qty-=q;state.sales.push({id:id(),customer:+d.customer,product:+d.product,qty:q,price,discount:+d.discount||0,net,paid:+d.paid||0,cost:q*p.buy,date:d.date})});
 bind('depositForm',d=>state.deposits.push({...d,customer:+d.customer,amount:+d.amount}));
 bind('expenseForm',d=>state.expenses.push({...d,amount:+d.amount}));
 bind('staffForm',d=>state.staff.push(d));
}
function toggleLang(){state.lang=state.lang==='bn'?'en':'bn';persist();render()}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wholesale-business-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);Object.assign(state,d);persist();render()}catch(e){alert('Invalid backup file')}};r.readAsText(f)}
document.getElementById('langBtn').onclick=toggleLang;load();render();
</script></body></html>
