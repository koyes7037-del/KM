<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>KM</title>
<style>
:root{--green:#14532d;--green2:#198754;--bg:#f3f6f4;--line:#dce5df;--ink:#17231b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--green);color:white;padding:18px 16px;position:sticky;top:0;z-index:2}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.4px}header p{margin:4px 0 0;font-size:13px;opacity:.9}
nav{display:flex;gap:8px;overflow:auto;padding:10px;background:white;border-bottom:1px solid var(--line);position:sticky;top:82px;z-index:2}
nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;font-weight:650;color:var(--green)}
nav button.active{background:var(--green);color:#fff}
main{padding:14px;max-width:850px;margin:auto}.panel{display:none}.panel.active{display:block}
.card{background:white;border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 2px 8px #102c1b0a}
h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#eef7f0;border-radius:12px;padding:13px}.stat small{display:block;color:#476452}.stat strong{font-size:22px}
label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd8cf;border-radius:9px;font:inherit;background:white}
button.primary{background:var(--green2);color:white;border:0;border-radius:10px;padding:11px 15px;font-weight:700;margin-top:12px}
button.secondary{background:#edf4ef;color:var(--green);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-weight:650}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.muted{color:#65756a;font-size:12px}.item{padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px 5px;border-bottom:1px solid var(--line)}th{color:#506257}
.total{font-size:20px;font-weight:800;color:var(--green)}.account-summary{display:grid;grid-template-columns:.82fr 1.18fr;gap:9px;align-items:stretch;margin:12px 0}.account-prev{background:#f0f4f1;border:1px solid var(--line);border-radius:10px;padding:9px}.account-prev small{display:block;color:#65756a;font-size:11px}.account-prev strong{display:block;font-size:13px;margin:3px 0 7px}.account-current{background:#eef7f0;border:1px solid #cfe2d4;border-radius:10px;padding:12px;display:flex;flex-direction:column;justify-content:center}.account-current small{color:#476452;font-size:12px}.account-current strong{font-size:21px;color:var(--green);margin-top:4px}.warning{background:#fff8e6;border:1px solid #f0dfa9;padding:10px;border-radius:10px;font-size:12px;line-height:1.5}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* Mobile-first refinements */
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{min-width:320px;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{touch-action:manipulation}
button{cursor:pointer}
@media(max-width:520px){
  header{padding:13px 12px 12px;padding-top:calc(13px + env(safe-area-inset-top))}
  h1{font-size:22px;line-height:1.2}
  header p{font-size:12px}
  nav{top:0;gap:7px;padding:8px 10px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{padding:10px 12px;font-size:13px;min-height:40px}
  main{padding:10px;max-width:100%;}
  .card{padding:12px;border-radius:12px;margin-bottom:10px}
  h2{font-size:17px;margin-bottom:10px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stat{padding:10px;border-radius:10px;min-width:0}
  .stat strong{font-size:19px;overflow-wrap:anywhere}
  .row{flex-wrap:wrap;gap:8px}
  .row>*{flex:1 1 125px;min-width:0}
  input,select,textarea{font-size:16px;padding:11px 10px;min-height:43px}
  button.primary,button.secondary{min-height:42px;padding:10px 12px}
  .account-summary{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:7px;margin:10px 0}
  .account-prev,.account-current{padding:9px;min-width:0;overflow-wrap:anywhere}
  .account-prev strong{font-size:12px}
  .account-current strong{font-size:18px;overflow-wrap:anywhere}
  table{display:block;width:100%;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;font-size:12px}
  td,th{padding:8px 6px}
  .total{font-size:18px}
}
@media(max-width:360px){
  .account-summary{grid-template-columns:1fr 1fr}
  .account-current strong{font-size:16px}
  .stat strong{font-size:17px}
}
.home-shortcuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.shortcut{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 4px;text-align:center;color:var(--ink);font-weight:650}.shortcut .ico{display:block;font-size:26px;margin-bottom:6px}.shortcut span:last-child{font-size:12px}.progress-track{height:10px;background:#e8eee9;border-radius:20px;overflow:hidden}.progress-fill{height:100%;background:#198754}@media(max-width:520px){.home-shortcuts{gap:6px}.shortcut{padding:9px 2px}.shortcut .ico{font-size:23px}.shortcut span:last-child{font-size:10px}}</style>

<style>
body.auth-locked>header,body.auth-locked>nav,body.auth-locked>main{display:none!important}
#kmAuthGate{max-width:430px;margin:12vh auto;padding:18px;background:#fff;border:1px solid #dce5df;border-radius:16px;box-shadow:0 8px 28px #102c1b12;font-family:system-ui,Arial,sans-serif}
#kmAuthGate h2{margin:0 0 8px;color:#14532d}#kmAuthGate label{display:block;margin:12px 0 5px;font-size:13px;font-weight:650}
#kmAuthGate input{width:100%;padding:12px;border:1px solid #cbd8cf;border-radius:9px;font:inherit}
#kmAuthGate button{width:100%;padding:12px;margin-top:12px;border:0;border-radius:9px;background:#198754;color:white;font-weight:700}

<div id="kmAuthGate">
<h2>KM Login</h2><p>Sign in with your KM account.</p>
<label>Email</label><input id="kmLoginEmail" type="email" autocomplete="username" placeholder="Email address">
<label>Password</label><input id="kmLoginPassword" type="password" autocomplete="current-password" placeholder="Password">
<button id="kmLoginButton" type="button">Sign In</button>
<div id="kmAuthMessage">Only accounts authorized by KM Admin can access the app.</div>
</div>
<div id="kmAccountBar" hidden><span id="kmAccountLabel">Signed in</span><button id="kmLogoutButton" type="button">Sign Out</button></div>

<header><h1>KM</h1></header>
<nav>
<button class="active" data-tab="home">Home</button><button data-tab="outlets">Outlets</button><button data-tab="slabs">Gift Slabs</button><button data-tab="products">Products</button><button data-tab="orders">Orders</button><button data-tab="invoice">Billing</button><button data-tab="history">Invoices</button><button data-tab="operations">Routes &amp; Targets</button><button data-tab="settings">Settings</button>
</nav>
<main>
<section id="home" class="panel active">
<div class="card"><h2>KM Dashboard</h2><div class="home-shortcuts">
<button class="shortcut" onclick="tab('invoice')"><span class="ico">🧾</span><span>New Bill</span></button>
<button class="shortcut" onclick="tab('outlets')"><span class="ico">🏪</span><span>Outlets</span></button>
<button class="shortcut" onclick="tab('products')"><span class="ico">📦</span><span>Products</span></button>
<button class="shortcut" onclick="tab('operations')"><span class="ico">🚚</span><span>Delivery</span></button>
<button class="shortcut" onclick="tab('operations')"><span class="ico">🎯</span><span>Targets</span></button>
<button class="shortcut" onclick="tab('operations')"><span class="ico">🗺️</span><span>Routes</span></button>
<button class="shortcut" onclick="tab('history')"><span class="ico">📊</span><span>Reports</span></button>
<button class="shortcut" onclick="tab('settings')"><span class="ico">⚙️</span><span>Settings</span></button></div></div><div class="grid">
<div class="stat"><small>Total Products</small><strong id="countProducts">0</strong></div>
<div class="stat"><small>Total Invoices</small><strong id="countBills">0</strong></div>
<div class="stat"><small>Today's Sales</small><strong id="todaySales">৳0</strong></div>
<div class="stat"><small>Storage</small><strong>On This Device</strong></div>
</div>
<div class="card"><h2>Welcome</h2><p>Products and invoices are saved in this device's browser.</p><div class="warning">Important: Multi-device online sync and secure employee login are not available yet. These require a server and secure account system.</div></div>
</section>
<section id="outlets" class="panel"><div class="card"><h2>Add New Outlet</h2>
<label>Store Name *</label><input id="outName" placeholder="Store Name"><label>Proprietor Name *</label><input id="outOwner" placeholder="Proprietor Name">
<label>Phone Number</label><input id="outPhone"><label>Address</label><input id="outAddress"><label>Route (Optional)</label><select id="outRoute" onchange="toggleOtherRoute()"><option value="">None / No Route</option><option value="1">Route 1</option><option value="2">Route 2</option><option value="3">Route 3</option><option value="4">Route 4</option><option value="5">Route 5</option><option value="6">Route 6</option><option value="other">Other (Optional)</option></select><div id="otherRouteWrap" style="display:none"><label>Other Route Name</label><input id="otherRouteName" placeholder="Enter route name (optional)"></div><label>Entered By (Optional)</label><select id="outEnteredBy"><option value="">Select Employee / Admin</option><option value="Admin">Admin</option></select>
<button class="primary" onclick="addOutlet()">Save Outlet</button></div><div class="card"><h2>Outlet List</h2><div id="outletList"></div></div></section>
<section id="slabs" class="panel"><div class="card"><h2>Set Gift Slab</h2>
<label>Outlet</label><select id="slabOutlet"></select><label>Slab Target Amount (BDT)</label><input id="slabTarget" type="number" min="1">
<label>Gift Name</label><input id="slabGiftName" placeholder="e.g. Rice Cooker"><label>Gift Value (BDT)</label><input id="slabGift" type="number" min="0"><button class="primary" onclick="saveSlab()">Save Slab</button></div>
<div class="card"><h2>Slab Progress</h2><div id="slabList"></div></div></section>
<section id="products" class="panel">
<div class="card"><h2>Add New Product</h2>
<label>Product Name</label><input id="pname" placeholder="e.g. Rice">
<label>Selling Price</label><input id="psell" type="number" min="0" placeholder="0">
<label>Unit (Optional)</label><input id="punit" placeholder="kg/piece">
<button class="primary" onclick="addProduct()">Save Product</button>
</div><div class="card"><h2>Product List</h2><div id="productList" class="muted">No products added yet.</div></div>
</section>
<section id="orders" class="panel">
<div class="card"><h2>Outlet Order Entry</h2>
<label>Outlet *</label><select id="orderOutlet"></select>
<label>Employee *</label><select id="orderEmployee"><option value="">Select Employee</option></select>
<div class="row"><div><label>Product</label><select id="orderProduct"></select></div><div><label>Quantity</label><input id="orderQty" type="number" min="0.01" step="0.01" value="1"></div></div>
<button class="secondary" onclick="addOrderItem()">Add Product</button>
<div id="orderCart" class="item muted">No products added.</div>
<button class="primary" onclick="submitOrder()">Submit Outlet Order</button>
<p class="muted">Orders are submitted for Admin review. Employees do not create invoices.</p>
</div>
<div class="card"><h2>Order Register / Admin Review</h2><div id="orderList"></div></div><div class="card"><h2>My Delivery Tasks</h2><div id="employeeDeliveryTasks"></div><p class="muted">After the outlet receives the goods, the responsible employee can confirm delivery here.</p></div>
</section>
<section id="invoice" class="panel">
<div class="card"><h2>New Invoice</h2>
<label>Select Outlet *</label><select id="billOutlet"></select><label>Proprietor Name *</label><div id="billOwner" class="item muted">Proprietor name appears after selecting an outlet</div>
<label>Prepared By</label><select id="employee"><option>Admin</option></select>
<div class="row"><div><label>Product</label><select id="billProduct"></select></div><div><label>Quantity</label><input id="billQty" type="number" min="0.01" step="0.01" value="1"></div></div>
<button class="secondary" onclick="addLine()">Add to Invoice</button>
<div id="billLines" class="item muted">No products added to invoice.</div>
<label>Additional Charge (BDT)</label><input id="extra" type="number" min="0" value="0">
<div class="card" style="padding:10px;margin-top:10px"><h3>Invoice Discount</h3><div class="row"><div><label>Discount (%)</label><input id="billDiscountPct" type="number" min="0" max="100" step="0.01" value="0"></div><div><label>Or Discount (BDT)</label><input id="billDiscountAmt" type="number" min="0" step="0.01" value="0"></div></div><small class="muted">Percentage and fixed discounts are both applied if entered.</small></div>
<label>Note (Optional)</label><input id="billNote" placeholder="Invoice note">
<p>Subtotal: <b id="grossSubtotal">৳0</b></p><p>Item Discount: <b id="lineDiscountTotal">৳0</b></p><p>Invoice Discount: <b id="billDiscountTotal">৳0</b></p><div class="account-summary"><div class="account-prev"><small>Previous Due</small><strong id="previousDue">৳0</strong><small>Total Outstanding</small><strong id="totalOutstanding">৳0</strong></div><div class="account-current"><small>New Invoice Amount</small><strong id="grandTotal">৳0</strong></div></div>
<button class="primary" onclick="saveBill()">Save Invoice</button>
</div>
</section>
<section id="history" class="panel"><div class="card"><h2>Invoice History</h2><div id="billList" class="muted">No invoices yet.</div></div></section>
<section id="operations" class="panel">
<div class="card"><h2>Admin • Employee & Route Setup</h2>
<label>Employee Name</label><input id="empName" placeholder="Employee name">
<label>Route</label><select id="empRoute"><option value="1">Route 1</option><option value="2">Route 2</option><option value="3">Route 3</option><option value="4">Route 4</option><option value="5">Route 5</option><option value="6">Route 6</option></select>
<label>Monthly Sales Target (BDT)</label><input id="empTarget" type="number" min="1">
<button class="primary" onclick="saveEmployee()">Save Employee</button></div>
<div class="card"><h2>Employee Achievement</h2><div id="employeeStats"></div></div>
<div class="card"><h2>Route Overview</h2><div id="routeStats"></div></div>
<div class="card"><h2>Delivery Management</h2><div id="deliveryList"></div></div></section>
<section id="settings" class="panel">
<div class="card"><h2>Settings</h2><p>App name: <b>KM</b></p><label>Language / ভাষা</label><select id="languageSelect" onchange="setLanguage(this.value)"><option value="en">English</option><option value="bn">বাংলা</option></select></div>
<div class="card"><h3>Data Backup</h3><p class="muted">Download this device's data as a JSON file. It will not sync automatically to other devices.</p><button class="secondary" onclick="backup()">Download Backup</button><label>Restore from Backup File</label><input type="file" id="restoreFile" accept=".json,application/json"><button class="secondary" onclick="restore()">Restore Backup</button></div>
<div class="card"><button class="secondary" onclick="clearData()">Delete All Data</button><p class="muted">This will delete products and invoices from this browser.</p></div>
</section>
</main>
<script>
const KEY='km_wholesale_starter_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"products":[],"bills":[],"shop":"KM"}');
db.outlets=Array.isArray(db.outlets)?db.outlets:[];
db.slabs=Array.isArray(db.slabs)?db.slabs:[];
db.ledger=Array.isArray(db.ledger)?db.ledger:[];db.employees=Array.isArray(db.employees)?db.employees:[];db.orders=Array.isArray(db.orders)?db.orders:[];db.language=db.language||'en';db.bills.forEach(b=>{if(!b.deliveryStatus)b.deliveryStatus='Pending'});
let cart=[];let orderCart=[];let activeOrderId=null;
const num=v=>{const n=Number.parseFloat(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:0};
const money=n=>'৳'+num(n).toLocaleString('en-BD',{minimumFractionDigits:0,maximumFractionDigits:2});
function persist(){localStorage.setItem(KEY,JSON.stringify(db));render();renderOperations();applyLanguage()}
function tab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function toggleOtherRoute(){const v=document.getElementById('outRoute').value;document.getElementById('otherRouteWrap').style.display=v==='other'?'block':'none'}
function routeLabel(v){if(v===undefined||v===null||v===''||v==='None')return 'None';if(String(v).startsWith('Other:'))return String(v).slice(6).trim()||'Other';return String(v).trim()!==''&&!Number.isNaN(Number(v))?'Route '+v:String(v)}
function addOutlet(){let name=outName.value.trim(),owner=outOwner.value.trim(),rv=document.getElementById('outRoute').value,route=rv==='other'?('Other: '+document.getElementById('otherRouteName').value.trim()):(rv||'None'),enteredBy=document.getElementById('outEnteredBy').value;if(!name||!owner){alert('Store name and proprietor name are required');return}if(rv==='other'&&!document.getElementById('otherRouteName').value.trim())route='Other';db.outlets.push({id:Date.now(),name,owner,phone:outPhone.value,address:outAddress.value,route,enteredBy});outName.value=outOwner.value=outPhone.value=outAddress.value='';document.getElementById('outRoute').value='';document.getElementById('otherRouteName').value='';document.getElementById('outEnteredBy').value='';toggleOtherRoute();persist();alert('Outlet saved')}
function saveSlab(){let outletId=+slabOutlet.value,target=+slabTarget.value,gift=+slabGift.value,giftName=slabGiftName.value.trim();if(!outletId||target<=0||slabGift.value===''||!giftName){alert('Enter outlet, slab target, gift name and gift value');return}
let x=db.slabs.find(a=>a.outletId===outletId);if(x){if(!confirm('The new slab will start from zero.'))return;x.target=target;x.gift=gift;x.giftName=giftName;x.progress=0}else db.slabs.push({id:Date.now(),outletId,target,gift,giftName,progress:0});slabGiftName.value=slabTarget.value=slabGift.value='';persist();alert('Gift slab saved')}
function resetSlab(id){let x=db.slabs.find(a=>a.id===id);if(x&&confirm('Start a new slab from zero?')){x.progress=0;persist()}}
function addProduct(){let name=pname.value.trim(),sell=+psell.value,unit=punit.value.trim();if(!name||psell.value===''){alert('Enter product name and selling price.');return}db.products.push({id:Date.now(),name,sell,unit});pname.value=psell.value=punit.value='';persist()}
function addLine(){
 const productSelect=document.getElementById('billProduct');
 const qtyInput=document.getElementById('billQty');
 const productId=Number(productSelect.value);
 const p=db.products.find(x=>Number(x.id)===productId);
 const q=qtyInput.valueAsNumber;
 const price=Number(p?.sell);
 if(!p || !Number.isFinite(q) || q<=0 || !Number.isFinite(price) || price<0){
  alert('Select a product and enter a valid quantity.'); return;
 }
 // Quantity field represents the final quantity for this product, not an extra amount.
 const old=cart.find(x=>Number(x.id)===productId);
 if(old){ old.qty=q; old.price=price; old.name=p.name; old.unit=p.unit||''; }
 else { cart.push({id:productId,name:p.name,price,qty:q,unit:p.unit||'',discountPct:0,discountFixed:0,fixedPrice:false}); }
 qtyInput.value='1';
 renderCart();
}
function updateLineDiscount(id,field,value){
 const x=cart.find(a=>Number(a.id)===Number(id));
 if(!x)return;
 if(field==='pct')x.discountPct=Math.max(0,Math.min(100,num(value)));
 if(field==='fixed')x.discountFixed=Math.max(0,num(value));
 renderCart();
}
function lineDiscountAmount(item){
 const gross=Math.max(0,num(item.qty)*num(item.price));
 if(item.fixedPrice)return 0;
 const pct=Math.max(0,Math.min(100,num(item.discountPct)));
 const fixed=Math.max(0,num(item.discountFixed));
 return Math.min(gross,gross*pct/100+fixed*Math.max(0,num(item.qty)));
}
// Keep an already-added product line synchronized when the user edits its quantity.
function syncSelectedQuantity(){
 const productId=Number(document.getElementById('billProduct').value);
 const qtyInput=document.getElementById('billQty');
 const q=qtyInput.valueAsNumber;
 const line=cart.find(x=>Number(x.id)===productId);
 if(line && Number.isFinite(q) && q>0){line.qty=q;renderCart();}
}
document.getElementById('billQty').addEventListener('input',syncSelectedQuantity);
document.getElementById('billProduct').addEventListener('change',()=>{
 const productId=Number(document.getElementById('billProduct').value);
 const line=cart.find(x=>Number(x.id)===productId);
 if(line)document.getElementById('billQty').value=String(line.qty);
});
function billTotals(){
 const gross=cart.reduce((sum,item)=>sum+num(item.qty)*num(item.price),0);
 const lineDiscount=cart.reduce((sum,item)=>sum+lineDiscountAmount(item),0);
 // Invoice-level discount is calculated only on non-fixed-price items,
 // after their individual item discounts. Fixed-price items are excluded.
 const invoiceDiscountBase=cart.reduce((sum,item)=>{
  if(item.fixedPrice)return sum;
  const itemGross=Math.max(0,num(item.qty)*num(item.price));
  return sum+Math.max(0,itemGross-lineDiscountAmount(item));
 },0);
 const extraAmount=Math.max(0,num(document.getElementById('extra').value));
 const pct=Math.max(0,Math.min(100,num(document.getElementById('billDiscountPct').value)));
 const pctDiscount=invoiceDiscountBase*pct/100;
 const fixed=Math.max(0,num(document.getElementById('billDiscountAmt').value));
 const billDiscount=Math.min(invoiceDiscountBase,pctDiscount+fixed);
 const final=Math.max(0,gross-lineDiscount+extraAmount-billDiscount);
 return {gross,lineDiscount,invoiceDiscountBase,afterLines:gross-lineDiscount+extraAmount,pctDiscount,fixed,billDiscount,final};
}
function renderCart(){
 const lines=document.getElementById('billLines');
 lines.innerHTML=cart.length?cart.map(x=>{
  const qty=num(x.qty),price=num(x.price),discount=Math.max(0,Math.min(100,num(x.discountPct))),fixed=Math.max(0,num(x.discountFixed));
  const lineGross=qty*price,lineDiscount=lineDiscountAmount(x),lineTotal=Math.max(0,lineGross-lineDiscount);
  const fixedPrice=!!x.fixedPrice;

async function kmSignIn(){const email=document.getElementById('kmLoginEmail').value.trim(),password=document.getElementById('kmLoginPassword').value;if(!email||!password){kmShowMessage('Enter your email and password.');return;}const b=document.getElementById('kmLoginButton');b.disabled=true;b.textContent='Signing in...';try{await kmAuth.signInWithEmailAndPassword(email,password);}catch(e){kmShowMessage(e.code==='auth/invalid-credential'?'Email or password is incorrect.':e.message||'Sign in failed.');}finally{b.disabled=false;b.textContent='Sign In';}}
